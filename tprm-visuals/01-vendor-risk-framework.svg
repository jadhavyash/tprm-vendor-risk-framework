  <line x1="310" y1="202" x2="310" y2="218" stroke="#6b7280" stroke-width="1.2" marker-end="url(#at)"/>
  <line x1="450" y1="202" x2="590" y2="202" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="590" y1="202" x2="590" y2="218" stroke="#6b7280" stroke-width="1.2" marker-end="url(#at)"/>
  <line x1="450" y1="202" x2="780" y2="202" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="780" y1="202" x2="780" y2="218" stroke="#6b7280" stroke-width="1.2" marker-end="url(#at)"/>
  <rect x="30" y="220" width="180" height="70" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="120" y="245" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">Tier 1 — Critical</text>
  <text x="120" y="263" text-anchor="middle" fill="#7d8590" font-size="10">Full questionnaire</text>
  <text x="120" y="278" text-anchor="middle" fill="#7d8590" font-size="10">On-site audit · Legal review</text>
  <rect x="225" y="220" width="180" height="70" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="315" y="245" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">Tier 2 — High</text>
  <text x="315" y="263" text-anchor="middle" fill="#7d8590" font-size="10">Standard questionnaire</text>
  <text x="315" y="278" text-anchor="middle" fill="#7d8590" font-size="10">SOC 2 review required</text>
  <rect x="500" y="220" width="180" height="70" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="590" y="245" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">Tier 3 — Medium</text>
  <text x="590" y="263" text-anchor="middle" fill="#7d8590" font-size="10">Lite questionnaire</text>
  <text x="590" y="278" text-anchor="middle" fill="#7d8590" font-size="10">Cert verification only</text>
  <rect x="695" y="220" width="180" height="70" rx="8" fill="#1f2937" stroke="#6b7280" stroke-width="1.5"/>
  <text x="785" y="245" text-anchor="middle" fill="#d1d5db" font-size="12" font-weight="600">Tier 4 — Low</text>
  <text x="785" y="263" text-anchor="middle" fill="#7d8590" font-size="10">Self-attestation</text>
  <text x="785" y="278" text-anchor="middle" fill="#7d8590" font-size="10">Annual review</text>
