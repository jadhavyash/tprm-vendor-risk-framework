<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="460" fill="#0d1117"/>
  <text x="450" y="34" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="600">Third-Party Risk Management (TPRM) Framework</text>
  <text x="450" y="52" text-anchor="middle" fill="#7d8590" font-size="12">ISO 27001 Annex A · NIST CSF · SOC 2 Type II assurance</text>
  <rect x="355" y="65" width="190" height="50" rx="8" fill="#1f2937" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="88" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Vendor Onboarding</text>
  <text x="450" y="106" text-anchor="middle" fill="#7d8590" font-size="11">New / renewal / change in scope</text>
  <line x1="450" y1="115" x2="450" y2="135" stroke="#6b7280" stroke-width="1.5" marker-end="url(#at)"/>
  <rect x="310" y="137" width="280" height="48" rx="8" fill="#1a2535" stroke="#6366f1" stroke-width="1.5"/>
