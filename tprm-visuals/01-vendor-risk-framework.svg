  <line x1="785" y1="325" x2="450" y2="325" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="450" y1="325" x2="450" y2="340" stroke="#6b7280" stroke-width="1.5" marker-end="url(#at)"/>
  <rect x="280" y="342" width="340" height="52" rx="8" fill="#1a1f3a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="450" y="364" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="600">Risk Scoring (0-100)</text>
  <text x="450" y="382" text-anchor="middle" fill="#7d8590" font-size="11">Data Security · IAM · IR · Compliance · Network · Physical</text>
  <line x1="450" y1="394" x2="450" y2="412" stroke="#6b7280" stroke-width="1.5" marker-end="url(#at)"/>
  <rect x="100" y="414" width="155" height="34" rx="6" fill="#14532d" stroke="#16a34a" stroke-width="1"/>
  <text x="177" y="436" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">APPROVE (85-100)</text>
  <rect x="265" y="414" width="185" height="34" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
  <text x="357" y="436" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">CONDITIONAL (50-84)</text>
  <rect x="460" y="414" width="185" height="34" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
  <text x="552" y="436" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">REJECT (&lt;50)</text>
  <rect x="655" y="414" width="155" height="34" rx="6" fill="#1a2535" stroke="#6366f1" stroke-width="1"/>
  <text x="732" y="436" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="600">EXCEPTION PROCESS</text>
  <defs><marker id="at" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/></marker></defs>
</svg>